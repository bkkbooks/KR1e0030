body:
  text: 春秋五禮例宗卷九宋張大亨撰賔禮下遇隠四年夏公及宋公遇于清八年春宋公衛侯遇于垂莊四年夏齊侯陳侯鄭伯遇于垂二十三年夏公及齊侯遇于榖三十年冬公及齊侯遇于魯濟三十二年夏宋公齊侯遇于梁丘公榖皆謂遇者不期而㑹也宗伯曰冬見曰遇鄭氏亦云欲若不期而至者國風野有蔓草男女思不期而㑹之詩也曰邂逅相遇則遇為不期審矣而榖梁又曰志相得也豈以无不同之可㑹无不協之可盟者乎如至公隠五年春公觀魚于棠桓二年九月公及戎盟于唐冬公至自唐十六年四月公㑹宋公衛侯陳侯蔡侯伐鄭秋七月公至自伐鄭十八年春王正月公㑹齊侯于濼公與夫人姜氏遂如齊莊五年冬公㑹齊人宋人陳人蔡人伐衛六年秋公至自伐衛二十二年冬公如齊納幣二十三年春公至自齊二十三年夏公如齊觀社二十六年公伐戎夏公至自伐戎僖四年春王正月公㑹齊侯宋公陳侯衛侯鄭伯許男曹伯侵蔡蔡潰遂伐楚次于陘盟于召陵秋及江人黄人伐陳八月公至自伐楚六年夏公㑹齊侯宋公陳侯衛侯曹伯伐鄭秋楚人圍許諸侯遂救許冬公至自伐鄭十年春王正月公如齊十五年王正月公如齊三月公㑹齊侯宋公陳侯衛侯鄭伯許男曹伯盟于牡丘遂次于匡公孫敖帥師及諸侯之大夫救徐十六年冬十二月公㑹齊侯宋公陳侯衛侯鄭伯許男邢侯曹伯于淮十七年九月公至自㑹二十六年冬公以楚師伐齊取榖公至自伐齊二十八年冬公㑹晉侯齊侯宋公蔡侯鄭伯陳子莒子邾子秦人于温諸侯遂圍許二十九年春公至自圍許三十三年冬十月公如齊十有二月公至自齊文三年冬公如晉十二月公及晉侯盟四年春公至自晉十三年冬公如晉十有二月己丑公及晉侯盟公還自晉鄭伯㑹公于棐十四年春王正月公至自晉十四年六月公㑹宋公陳侯衛侯鄭伯許男曹伯晉趙盾癸酉同盟于新城秋七月公至自㑹十七年六月癸未公及齊侯盟于榖諸侯㑹于扈秋七月公至自榖宣四年秋公如齊公至自齊五年春公如齊夏公至自齊七年夏公㑹齊侯伐萊秋公至自伐萊冬公㑹晉侯衛侯鄭伯曹伯于黒壌八年春公至自㑹九年春王正月公如齊公至自齊十年春公如齊公至自齊十七年六月己未公㑹晉侯衛侯曹伯邾子同盟于斷道秋公至自㑹成三年春王正月公㑹晉侯宋公衛侯曹伯伐鄭二月公至自伐鄭夏公如晉公至自晉四年四月公如晉秋公至自晉五年十二月己丑公㑹晉侯齊侯宋公衛侯鄭伯曹伯邾子把伯同盟于蟲牢六年春王正月公至自㑹七年秋公㑹晉侯齊侯宋公衛侯曹伯莒子邾子把伯救鄭八月戊辰同盟于馬陵公至自㑹九年春王正月公㑹晉侯齊侯宋公衛侯鄭伯曹伯莒子把伯同盟于蒲公至自㑹十年秋七月公如晉十一年春王三月公至自晉十三年三月公如京師五月公自京師遂㑹晉侯齊侯宋公衛侯鄭伯曹伯邾人滕人伐秦秋七月公至自伐秦十五年三月癸丑公㑹晉侯衛侯鄭伯曹伯宋世子成齊國佐邾人同盟于戚公至自㑹十六年秋公㑹晉侯齊侯衛侯宋華元邾人于沙隨不見公公至自㑹公㑹尹子晉侯齊國佐邾人伐鄭十二月公至自㑹十七年夏公㑹尹子單子晉侯齊侯宋公衛侯曹伯邾人伐鄭六月乙酉同盟于柯陵秋公至自㑹冬公㑹單子晉侯宋公衛侯曹伯齊人邾人伐鄭十有一月公至自伐鄭十八年春王正月公如晉夏公至自晉襄三年春公如晉四月公至自晉六月公㑹單子晉侯宋公衛侯鄭伯莒子邾子齊世子光己未同盟于雞澤秋公至自㑹四年冬公如晉五年春公至自晉五年秋公㑹晉侯宋公陳侯衛侯鄭伯曹伯莒子邾子滕子薛伯齊世子光吳人鄫人于戚公至自㑹冬公㑹晉侯宋公衛侯鄭伯曹伯齊世子光救陳十二月公至自救陳八年春王正月公如晉夏季孫宿㑹晉侯鄭伯齊人宋人衛人邾人于邢丘公至自晉十年春公㑹晉侯宋公衛侯曹伯莒子邾子滕子薛伯杞伯小邾子齊世子光㑹吳于祖五月甲午遂滅偪陽公至自㑹秋公㑹晉侯宋公衛侯曹伯莒子邾子齊世子光滕子薛伯把伯小邾子伐鄭冬公至自伐鄭十一年夏公㑹晉侯宋公衛侯曹伯齊世子光莒子邾子滕子薛伯把伯小邾子伐鄭秋七月同盟于亳城北公至自伐鄭公㑹晉侯宋公衛侯曹伯齊世子光莒子邾子滕子薛伯把伯小邾子伐鄭㑹于蕭魚公至自㑹十二年冬公如晉十三年春公至自晉十六年三月公㑹晉侯宋公衛侯鄭伯曹伯莒子邾子薛伯把伯小邾子于溴梁戊寅大夫盟夏公至自㑹十八年冬十月公㑹晉侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子同圍齊十九年春王正月諸侯盟于祝柯公至自伐齊二十年夏六月庚申公㑹晉侯齊侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子盟于澶淵秋公至自㑹二十一年春王正月公如晉夏公至自晉冬十月公㑹晉侯齊侯宋公衛侯鄭伯曹伯莒子邾子于商任二十二年春王正月公至自㑹二十二年冬公㑹晉侯齊侯宋公衛侯鄭伯曹伯莒子邾子薛伯把伯小邾子于沙隨公至自㑹二十四年八月公㑹晉侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子于夷儀冬公至自㑹二十五年五月公㑹晉侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子于夷儀秋八月己巳諸侯同盟于重丘公至自㑹二十八年十一月公如楚二十九年王正月公在楚夏五月公至自楚昭二年冬公如晉至河乃復五年春王正月公如晉秋七月公至自晉七年三月公如楚九年公至自楚十二年夏公如晉至河乃復十三年秋公㑹劉子晉侯齊侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子于平丘八月甲戌同盟于平丘公不與􅉀公至自㑹冬十月公如晉至河乃復十五年冬公如晉十六年夏公至自晉二十一年冬公如晉至河乃復二十三年冬公如晉至河有疾乃復二十五年九月公孫于齊次于陽州十二月齊侯取鄆二十六年三月公至自齊居于鄆秋公㑹齊侯莒子邾子把伯盟于鄟陵公至自㑹居于鄆二十七年春公如齊公至自齊居于鄆冬十月公如齊公至自齊居于鄆二十八年三月公如晉次于乾侯二十九年春公至自乾侯居于鄆二十九年春公如晉次于乾侯冬十月鄆潰三十年正月公在乾侯三十一年春王正月公在乾侯三十二年春王正月公在乾侯定三年春王正月公如晉至河乃復四年三月公㑹劉子晉侯宋公蔡侯衛侯陳侯鄭伯許男曹伯莒子邾子頓子胡子滕子薛伯把伯小邾子齊國夏于召陵侵楚五月公及諸侯盟于臯鼬秋七月公至自㑹六年二月公侵鄭公至自侵鄭八年春王正月公侵齊公至自侵齊二月公侵齊三月公至自侵齊夏公㑹晉侯于瓦公至自瓦十年夏公㑹齊侯于夾谷公至自夾谷十二年冬十月癸亥公㑹齊侯盟于黄十一月公至自黄十二月公圍成公至自圍成十四年五月公㑹齊侯衛侯于牽公至自㑹哀十年二月公㑹吳伐齊五月公至自伐齊十三年夏公㑹晉侯及吳子于黄池秋公至自㑹夫人公及如一見公如門聘至三見昏門莊五年夏夫人姜氏如齊師十五年夏夫人姜氏如齊十九年秋夫人姜氏如莒二十年春王二月夫人姜氏如莒文九年春夫人姜氏如齊三月夫人姜氏至自齊内大夫如𦵏十二如盟四如結昏五見如乞師如奔各本門莊二十五年冬公子友如陳三十二年冬公子慶父如齊僖五年夏公孫茲如牟七年秋公子友如齊十三年冬公子友如齊二十八年秋公子遂如齊三十年冬公子遂如京師遂如晉三十一年春公子遂如晉文元年夏叔孫得臣如京師冬公孫敖如齊五年夏公孫敖如晉六年夏季孫行父如陳秋季孫行父如晉十一年秋公子遂如宋十五年夏季孫行父如晉秋季孫行父如晉十七年冬公子遂如齊十八年秋公子遂叔孫得臣如齊十月季孫行父如齊宣元年夏季孫行父如齊公子遂如齊八年夏六月公子遂如齊至黄乃復辛巳卒于垂九年夏仲孫蔑如京師十年秋季孫行父如齊冬公孫歸父如齊十八年七月公孫歸父如晉冬十月公薨歸父還自晉至笙遂奔齊成五年正月仲孫蔑如宋六年六月公孫嬰齊如晉冬季孫行父如晉八年春公孫嬰齊如莒十一年夏季孫行父如晉秋叔孫僑如如齊襄二年秋七月叔孫豹如宋四年夏叔孫豹如晉五年夏叔孫豹鄫世子巫如晉六年冬叔孫豹如邾季孫宿如晉七年秋季孫宿如衛九年夏季孫宿如晉十六年冬叔孫豹如晉十九年春季孫宿如晉二十年秋叔老如齊冬十月季孫宿如宋二十四年春叔孫豹如晉冬叔孫豹如京師二十八年八月仲孫羯如晉二十九年冬仲孫羯如晉昭二年夏叔弓如晉冬季孫叔如晉六年夏季孫宿如晉冬叔弓如楚八年夏叔弓如晉九年秋仲孫貜如齊十三年晉人執季孫意如以歸十四年春意如至自晉二十三年叔孫婼如晉晉人執我行人叔孫婼二十四年春婼至自晉二十五年春叔孫婼如宋定六年夏季孫斯仲孫何忌如晉十年冬叔孫州仇如齊外如㑹如師四見㑹盟二門與内大夫如一見上桓五年夏齊侯鄭伯如紀冬州公如曹六年正月實來文十四年冬單伯如齊齊人執單伯十五年六月單伯至自齊左氏曰凡公行告于廟及行飲至舍爵䇿勲焉禮也公行之禮雖不槩見然卿大夫受命以出則釋幣於禰比其反也釋奠于禰席於阼階與其室老及從行者獻酬而出上介亦如之以使介之出如此則公行告廟飲至之禮宜亦當然其或自外來者雖非出而亦以其至告廟且飲其從至者故亦書至焉榖梁謂致君者殆其徃而喜其反此主自内出者言之可也其或以前事至或以後事至或以地至則告有異同事有大小各因其實以示義耳其曰惡事不致㑹夷狄不致離㑹不致桓㑹不致於經無所攷之然公居於外而亦書如至者以君出載禮而行覲禮謂侯氏禆冕釋幣於禰是也内大夫出而不書至惟執則至焉葢君遣使於外則亦告其事於廟已事而反則無所用告若為外所執則宗廟與有辱焉其反也告之所以安祖考也凡魯公出朝卿出聘皆曰如自我往者書其始則以未成事言之其朝於王所則曰朝自外告者書其終則以既成事言之若其以成事行則又但正名其事而已矣春秋五禮例宗卷九欽定四庫全書
