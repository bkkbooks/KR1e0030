body:
  text: 春秋五禮例宗卷二宋張大亨撰凶禮上䘮𦵏天王隠三年三月庚戌天王崩平王秋武氏子來求賻桓十五年三月乙未天王崩此後莊王僖王不書莊三年五月𦵏桓王僖八年冬十二月丁未天王崩惠王文八年八月戊申天王崩十月公孫敖如京師不至而復丙戌奔莒九年春毛伯來求金二月叔孫得臣如京師辛丑𦵏襄王宣二年冬十月乙亥天王崩三年正月𦵏匡王成五年冬十一月己酉天王崩定王襄元年九月辛酉天王崩二年正月𦵏蕳王二十八年十二月甲寅天王崩靈王左傳二十九年五月𦵏昭二十二年夏四月乙丑天王崩六月叔鞅如京師𦵏景王左氏曰凡崩薨不赴則不書禍福不告亦不書懲不敬也大僕稱大䘮始崩戒鼓傳逹於四方窆亦如之則王之崩𦵏皆赴告于天下大行人稱大䘮詔相諸侯之禮康王之誥稱太保率西方諸侯畢公率東方諸侯則王崩諸侯來奔小宰稱䘮荒受其含禭幣玉之事則王䘮諸侯來贈左氏稱天子七月而𦵏同軌畢至則王𦵏諸侯來㑹此經常之制也春秋之時禮失其舊王崩不赴者三魯不㑹其𦵏者七其他可知也經書王𦵏五公榖曰天子志崩不志𦵏誤矣或曰天王或曰天子或曰王公榖謂之通稱是也何休曰天王三不書天以桓公弑君而天子錫命襄王􅈖人妾且㑹其𦵏皆為非禮故去天以示貶趙陸從焉范寗非之當矣然有未盡者葢春秋書王不稱天者甚衆曰王正王子王姬王師之類何獨彼三者哉説者謂吳楚稱王故春秋加天以别之是又不然吳楚之王經未嘗志也又安用别且周官司服凡䘮為天王斬衰則王之加天尚矣王之為言至尊之稱也加天焉明無上也以其配天則曰天王以其繼天則曰天子三者皆至尊也以其皆至尊故雖但曰王而不嫌於有所黜且臣之爵得之扵君故可以善而升可以罪而黜若王則得之天者也何自而黜之聖人作經所以抗王室也王之失禮正其名以見之耳未聞有黜其號以示貶者弗思而已矣未成王昭二十二年冬十月王子猛卒王女莊二年秋七月齊王姬卒后夫人之䘮皆赴后赴于天下夫人赴于隣好之國其弔𦵏亦略如王與諸侯之䘮然春秋不書者内外詳略之義也故穆后之䘮晉荀躒如周𦵏晉少姜之䘮魯昭公鄭伯皆往又卿共其葬事而不書扵册其或書者以魯嘗與其事故為之終也王大夫隠三年四月辛卯尹氏卒文三年五月王子虎卒定四年七月劉卷卒七月𦵏劉文公諸侯之大夫卒自命卿以上則赴于隣好之國王大夫亦然然而不書者略外也卒且不書况于𦵏乎其或書者皆以故耳公隠十一年冬十一月壬辰公薨公子翬弑之桓十八年夏四月丙子公薨于齊齊侯使彭生弑之丁酉公之䘮至自齊十二月己丑𦵏我君桓公莊三十二年八月癸亥公薨于路寢閔元年六月辛酉𦵏我君莊公二年秋八月辛丑公薨慶父弑之僖三十三年乙巳公薨于小寢文元年二月天王使叔服來㑹𦵏四月丁巳𦵏我君僖公文十八年春二月丁丑公薨于臺下六月癸酉𦵏我君文公宣十八年冬十月壬戌公薨于路寢成元年二月辛酉𦵏我君宣公十八年八月己丑公薨于路寢十二月丁未𦵏我君成公襄三十一年夏六月辛巳公薨于楚宫冬十月滕子來㑹𦵏癸酉𦵏我君襄公昭三十二年十二月己未公薨于乾侯定元年夏六月癸亥公之䘮至自乾侯秋七月癸巳𦵏我君昭公十五年五月壬申公薨于髙寢邾子來奔䘮九月滕子來㑹𦵏丁巳𦵏我君定公雨不克𦵏戊午日下昃乃克𦵏榖梁曰公薨地不地故也夫人薨不地地故也公薨必地而地不必常以其有邦國之事也夫人則無外事矣不薨于寢則謹其地以明其故然所謂故者非必不以其道終凡非常者皆是也外諸侯内大夫之卒皆不地略之也其或不卒于寢則亦謹其地所以别嫌明微也曽子曰吾得正而斃焉斯已矣君子之慎其終葢如此𦵏者臣子所以自盡敵以下所以相哀之道也故内曰我君外曰公周制列爵惟五内則天子三公外則大國之君皆為公書有周公召公畢公三公也制微子之命曰庸建爾於上公大國之君也其餘皆自侯以下然攷於經五等之君通可謂之公亦通可謂之侯公侯爵之貴者故人以是稱之聖人弗奪焉所以崇敬譲也康王之誥稱羣公與儀禮通稱之公春秋稱諸侯與餘經通稱之侯皆兼五等之謂以二者均為爵之貴故雖公謂之侯而不嫌扵卑雖子男謂之公而不嫌於過也然而班列有差大小有宜亦不可亂故經扵平居則正其爵𦵏則從其稱正其爵者所以明王度之不廢也從其爵者所以示敵體之相敬也雖曰正其爵矣而於盟㑹之總稱亦曰侯於世族之總稱亦曰公子公孫則其所以示敬者葢不獨𦵏之時為然也魯君侯也而稱公則以春秋之義也然方在㑹盟則亦或謂之諸侯矣楚子也而不書𦵏則以稱號之僣也然方書世族則亦皆謂之公子此之謂两盡榖梁曰諡所以成德也𦵏而後舉諡於卒事乎加之矣范氏謂天子崩稱天命以諡之諸侯薨天子諡之卿大夫卒受諡於其君葢禮大䘮大師帥瞽作諡小䘮太史賜諡卿大夫之䘮小史賜諡瞽史知天道者則諡所以名鬼神皆以天道正之也太史既曰小䘮而小史又曰卿大夫之䘮則小䘮宜為諸侯矣鄭氏謂小史亦以太史賜諡為節事相成失之未成君莊三十二年冬十月己未子般卒慶父弑之文十八年冬十月子卒襄三十一年秋九月癸巳子野卒左氏曰凡在䘮王曰小童公侯曰子公羊曰君存稱世子君薨稱子某既𦵏稱子逾年稱公由左氏之説則未𦵏在䘮通稱曰子既𦵏遂稱爵不必俟逾年也由公羊之説則未𦵏在䘮稱子某既𦵏猶稱子而不名必待踰年然後稱爵也攷於經則左氏之説于書外可公羊之説于書内可二家不能該内外是以不通為公羊者曰先君雖𦵏然一年不可有二君故必踰年然後稱公若施之于外則宣之十年不當有两齊侯成之四年不當有两鄭伯也為左氏者曰諸侯既𦵏則嗣子卒哭而免䘮遂可以君國若施于内則子赤不當不稱公也古者先君未𦵏嗣子居廬未有命戒不自君其國人故未可正其為君之名曰子者對父之詞也既𦵏則免䘮出命而臨人雖未逾年已成其為君矣故因其爵而稱之陳侯㑹于温㑹于召陵宋公㑹于葵丘皆書曰子先君未𦵏也齊惠公卒于宣十年夏既𦵏冬書齊侯使國佐來聘鄭㐮公卒于成四年夏既𦵏冬書鄭伯伐許皆未踰年而既𦵏也該二家之例則先君未𦵏稱子既𦵏或逾年稱爵然後為通若其書内則雖𦵏未逾年稱子其曰子般子野者二子在䘮而卒未成為君猶以公子之例書之也若夫衛成公既𦵏而㑹諸侯於洮猶且稱子與衛成公出奔其弟叔武㑹諸侯于踐土亦稱曰子皆春秋之變例也以彼之例書此之事然後見聖人之意或曰既𦵏不俟逾年稱爵則然矣而鄭莊公卒于桓十一年之夏其秋𦵏其九月書鄭忽奔衛上云突歸于鄭景王崩于昭二十二年之夏其六月𦵏其下書王子猛居于皇其冬書王子猛卒又曹莊公卒于莊二十三年其明年春𦵏其冬書曹覊奔陳莒子宻州弑于㐮三十一年其明年書莒展奔吳鄭忽王猛皆既𦵏未踰年而不稱爵曹覊莒展已逾年而不稱爵何也曰此三者雖已既立其位未定也覊之奔以赤争之猛之出以子朝争之赤後立是為僖公突後立是為厲公去疾後立為著丘公則覊忽展皆失位而不終者也子朝之立雖在猛卒之後然當猛之世固不能定朝也春秋之世固有始立而争者然嘗能自定其位天子已命之諸侯已列之則遂正其為君衛君剽是也其或未能自定又未命于天子未列于諸侯則不正其為君覊忽與展是也猛立之義葢亦如此曰王猛則以國氏與覊忽同也凡以國氏者皆嘗立者也猛之卒也謂之王子則以立而未定且不克終與忽稱世子同也凡稱子者皆未成君者也然則國君已立强者未賔出力而争之聖人不為之正其名而反因其未定遂奪其位無乃助簒乎曰是不然彼立者不能自定强者争之而能終有國子將奪争者之名以加于彼是争者之罪冺而彼以無國稱君也三子當立而位未定彼争者不當立而終有其國各正其名以書之其罪否則見乎詞焉然後天下後世可信也曰其見乎詞奈何曰突赤之入不繫之國則知覊忽之當立子朝之立歸于尹氏則知王猛之當立也然則聖人之意可見矣以當立而不能自定猶且如此况其不當立者乎夫人隠元年秋七月天王使宰咺來歸惠公仲子之􅈖孝公妾惠母二年十二月乙卯夫人子氏薨莊二十一年七月戊戌夫人姜氏薨桓夫人莊母二十二年正月癸丑𦵏我小君文姜僖元年秋七月戊辰夫人姜氏薨于夷齊人以歸莊夫人閔嫡母十二月丁巳夫人氏之䘮至自齊二年夏五月辛巳𦵏我小君哀姜文四年冬十一月壬寅夫人風氏薨五年正月王使榮叔歸含且􅈖三月辛亥𦵏我小君成風王使召伯來㑹𦵏九年冬秦人來歸僖公成風之禭十六年秋八月辛未夫人姜氏薨十七年夏四月癸亥𦵏我小君聲姜宣八年六月戊子夫人嬴氏薨文二妃宣公嫡母出姜大歸榖作熊氏冬十月己丑𦵏我小君敬嬴雨不克𦵏庚寅日中而克𦵏襄二年夏五月庚寅夫人姜氏薨七月己丑𦵏我小君齊姜四年秋七月戊子夫人姒氏薨成公妾八月辛亥𦵏我小君定姒九年五月辛酉夫人姜氏薨宣夫人成母秋八月癸未𦵏我小君穆姜昭十一年五月甲申夫人姜氏薨㐮夫人昭母九月己亥𦵏我小君齊歸定十五年七月壬申姒氏卒定公妾哀母九月辛巳𦵏定姒哀十二年夏五月甲辰孟子卒昭夫人士死於適室復畢乃赴於君君使人弔禭之將𦵏遷於廟既祖而後􅈖贈者進焉卒窆乃反哭三虞卒哭明日以其班祔士既然則天子諸侯后夫人宜亦皆然矣葢士死於適室則知天子諸侯終於路寢后夫人卒於内寢也士赴於君則知天子及后赴於天下諸侯及夫人赴於王與隣好之國也士將𦵏遷於廟已𦵏反哭卒哭而祔則知天子以下其禮亦然也有一不備則不為成禮故左氏於夫人之䘮互見其義葢不獨夫人為然也然其不曰夫人不言薨不書𦵏者各主其事之是非耳凡䘮禮貝玉曰含反其精也衣衾曰禭遂其往也幣馬曰􅈖周於死也貨財曰賻助於生也含禭正施於斂􅈖賻正施於𦵏通言之皆曰贈知死者贈禭知生者􅈖賻公女莊四年三月紀伯姬卒六月乙丑齊侯𦵏紀伯姬二十九年十二月紀叔姬卒惠女歸于酅者三十年八月癸亥𦵏紀叔姬僖九年秋七月乙酉伯姬卒未適十六年夏四月丙申鄫季姬卒文十二年二月庚子子叔姬卒成八年冬十月癸卯把叔姬卒九年正月把伯來逆叔姬之䘮以歸襄三十年五月甲午宋灾宋伯姬卒七月叔弓如宋𦵏宋共姬公羊謂外夫人不書卒𦵏適諸侯則尊同以吾為之變卒之也女子許嫁笄而字之死則以成人之䘮治之其書𦵏者皆有故也夫王姬下王后一等則公女亦下夫人一等王姬嫁於諸侯為下嫁則公女嫁於大夫亦為下嫁嫁諸侯則為尊於内女故内女書卒視大夫為外夫人則書卒書𦵏視諸侯嫁而不書卒𦵏者不赴不㑹也公羊誤矣内大夫隠元年冬十二月公子益師卒五年冬十二月辛巳公子彊卒八年冬十二月無駭卒九年三月挾卒莊三十二年秋七月癸巳公子牙卒僖十六年三月壬申公子季友卒秋七月甲子公孫茲卒文十年三月辛卯臧孫辰卒八年公孫敖奔莒十四年九月甲申公孫敖卒于齊十五年夏齊人歸公孫敖之䘮宣五年秋九月叔孫得臣卒八年六月公子遂如齊至黄乃復辛巳有事于太廟仲遂卒于垂壬午猶繹萬入去籥十七年冬十一月壬午公弟叔肸卒成四年夏四月甲寅臧孫許卒十五年三月乙巳仲嬰齊卒十七年冬十一月壬申公孫嬰齊卒于貍脤魯地名襄五年十二月辛未季孫行父卒十九年八月丙辰仲孫蔑卒二十二年秋七月辛酉叔老卒二十三年八月己卯仲孫遂卒三十一年九月己亥仲孫羯卒昭四年冬十二月乙卯叔孫豹卒七年冬十一月癸未季孫宿卒十五年十一月癸酉有事于武宫籥入叔弓卒去樂卒事二十一年八月乙亥叔輙卒二十三年正月癸丑叔鞅卒二十四年春二月丙戌仲孫貜卒二十五年冬十月戊辰叔孫婼卒二十九年夏四月庚子叔詣卒定五年六月丙申季孫意如卒秋七月壬子叔孫不敢卒哀三年秋七月丙子季孫斯卒君之卿佐國之貳也存亡所繫國實與焉故經悉書之周制卿大夫之䘮天子弔之其斂哭之事則皆掌於王官以天子遇其臣之禮如此則諸侯可知也士䘮禮君若有賜則視大斂以君遇士之禮如此則卿大夫可知也然君於士不親弔不視小斂則士下於大夫故也左氏謂君不與小斂故不書日杜氏曰所以示厚薄戒將來也㨿經叔孫婼叔詣之卒昭公在外公孫敖仲遂公孫嬰齊之卒䘮在外然皆書日杜氏謂公在外則非無恩䘮在外則不責人以所不得也夫以書日為厚以不書日為無恩則是日月有褒貶之義矣而杜氏又謂春秋不以日月為例此獨記日未足以褒貶人君自相戾何哉若不以日月為例且無褒貶則卿卒不日是特記不小斂耳既特記不小斂則凡在外者又何必書日以明非君無恩邪子赤公子之為嗣君者也其卒亦不書日則史之失載如此多矣何獨於卿而遂以為例乎臧僖伯之卒也隠公𦵏之加一等則卿𦵏亦國之事而不書者其得失非足以繫國且𦵏臣子所以自盡敵以下所相哀之道也故不以累君諸侯隠三年八月庚辰宋公和卒十二月癸未𦵏宋穆公七年三月滕侯卒八年夏六月己亥蔡侯考父卒八月𦵏蔡宣公六月辛亥宿男卒桓五年正月甲戌己丑陳侯鮑卒再赴夏𦵏陳桓公十年正月庚申曹伯終生卒夏五月𦵏曹桓公十一年夏五月癸未鄭伯寤生卒秋七月𦵏鄭莊公十二年八月壬辰陳侯躍卒十一月丙戌衛侯晉卒十三年三月𦵏衛宣公十四年冬十二月丁巳齊侯禄父卒十五年夏四月己巳𦵏齊僖公十七年六月丁丑蔡侯封人卒八月癸巳𦵏蔡桓侯莊元年冬十月乙亥陳侯林卒二年二月𦵏陳莊公二年十二月乙酉宋公馮卒三年夏四月𦵏宋莊公十六年十二月邾子克卒二十一年夏五月辛酉鄭伯突卒冬十二月𦵏鄭厲公二十三年冬十一月曹伯射姑卒二十四年三月𦵏曹莊公二十五年夏五月癸丑衛侯朔卒二十八年夏四月丁未邾子𤨏卒三十一年四月薛伯卒僖四年夏許男新臣卒卒于㑹八月𦵏許穆公七年秋七月曹伯般卒冬𦵏曹昭公九年三月丁丑宋公御説卒九月甲子晉侯佹諸卒十二年冬十二月丁丑陳侯杵臼卒十三年夏四月𦵏陳宣公十四年冬蔡侯肸卒十七年冬十二月乙亥齊侯小白卒十八年秋八月丁亥𦵏齊桓公二十三年夏五月庚寅宋公茲父卒冬十一月把子卒二十四年冬晉侯夷吾卒二十五年四月癸酉衛侯燬卒秋𦵏衛文公二十七年夏六月庚寅齊侯昭卒秋八月乙未𦵏齊孝公二十八年六月陳侯款卒三十二年夏四月己丑鄭伯㨗卒冬十二月己卯晉侯重耳卒三十三年四月癸巳𦵏晉文公文五年冬十月甲申許男業卒六年春𦵏許僖公六年八月乙亥晉侯驩卒冬十月公子遂如晉𦵏晉㐮公七年夏四月宋公王臣卒九年秋八月曹伯㐮卒冬𦵏曹共公十三年夏五月壬午陳侯朔卒邾子蘧蒢卒十四年夏五月乙亥齊侯潘卒十八年二月秦伯罃卒宣三年冬十月丙戌鄭伯蘭卒𦵏鄭穆公四年春正月秦伯稻卒九年八月滕子卒九月辛酉晉侯黒臀卒于扈晉地與宋公衛侯鄭伯曹伯㑹于扈冬十月癸酉衛侯鄭卒十年夏四月己巳齊侯元卒公如齊五月公至自齊六月公孫歸父如齊𦵏齊惠公十四年夏五月壬申曹伯夀卒九月𦵏曹文公十七年春正月庚子許男錫我卒夏𦵏許昭公正月丁未蔡侯申卒夏𦵏蔡文公十八年秋七月甲戌楚子旅卒成二年八月壬午宋公鮑卒二年十二月𦵏宋文公二年八月庚寅衛侯速卒三年正月辛亥𦵏衛穆公四年三月壬申鄭伯堅卒夏四月𦵏鄭㐮公六年六月壬申鄭伯費卒九年秋七月丙子齊侯無野卒冬十一月𦵏齊頃公十年五月丙午晉侯儒卒十三年五月㑹伐秦曹伯廬卒于師冬𦵏曹宣公十四年正月莒子朱卒冬十月庚寅衛侯臧卒十五年二月𦵏衛定公秦伯卒同衛侯卒之月十五年夏六月宋公固卒秋八月庚辰𦵏宋共公十六年夏四月辛未滕子卒十七年十二月邾子貜且卒襄二年六月庚申鄭伯㫻卒四年春三月己酉陳侯午卒七月𦵏陳成公六年三月壬午把伯姑容卒秋𦵏把桓公七年十二月㑹于鄬鄭伯髠頑如㑹未見諸侯丙戌卒于郢八年夏𦵏鄭僖公十二年秋九月吳子乗卒十三年九月庚辰楚子審卒十五年冬十一月癸亥晉侯周卒十六年正月𦵏晉悼公十七年春二月庚午邾子卒十八年冬十月㑹圍齊曹伯負芻卒于師十九年春正月𦵏曹成公十九年秋七月辛卯齊侯環卒冬𦵏齊靈公二十三年己巳把伯匄卒夏𦵏把孝公二十五年十二月吳子遏伐楚門于巢卒二十六年八月壬午許男寗卒于楚請楚伐鄭冬𦵏許靈公二十八年十二月乙未楚子昭卒二十九年五月庚午衛侯衎卒秋九月𦵏衛獻公昭元年六月丁巳邾子華卒秋𦵏邾悼公冬十一月己酉楚子麋卒三年春正月丁未滕子原卒夏叔弓如滕五月𦵏滕成公五年七月秦伯卒六年正月𦵏秦景公六年春正月把伯益姑卒夏𦵏把文公七年秋八月戊辰衛侯惡卒十二月癸亥𦵏衛㐮公八年夏四月辛丑陳侯溺卒十月國為楚所滅十月𦵏陳哀公十年七月戊子晉侯彪卒九月叔孫婼如晉𦵏晉平公十二月甲子宋公成卒十一年二月叔弓如宋𦵏宋平公十二年三月壬申鄭伯嘉卒五月𦵏鄭簡公