body:
  text: 春秋五禮例宗卷十宋張大亨撰嘉禮昏王娶桓八年十月祭伯來遂逆王后于紀九年春紀季姜歸于京師襄十五年二月劉夏逆王后于齊娶王女莊元年夏單伯送王姬秋築王姬之舘于外冬王姬歸于齊十一年冬王姬歸于齊内娶桓三年七月公子翬如齊逆女九月齊侯送姜氏于讙公㑹齊侯于讙夫人姜氏至自齊莊二十二年冬公如齊納幣二十四年公如齊逆女秋公至自齊八月丁丑夫人姜氏入戊寅大夫宗婦覿用幣文二年冬公子遂如齊納幣四年夏逆婦姜于齊十八年冬十月夫人姜氏歸于齊宣元年正月公子遂如齊逆女二月遂以夫人婦姜至自齊成十四年秋叔孫僑如如齊逆女九月僑如以夫人婦姜氏至自齊娶内女隠二年九月紀裂繻來逆女冬十月伯姬歸于紀莊十二年紀叔姬歸于酅十九年公子結媵陳人之婦于鄄二十五年夏伯姬歸于把二十七年冬把伯姬來僖二十八年秋杞伯姬來二十七年莒慶來逆叔姬僖十四年夏季姬與鄫子遇于防鄫子來朝十五年季姬歸于鄫二十五年宋蕩伯姬來逆婦三十一年把伯姬來求婦文十四年齊人執子叔姬十五年齊人來歸子叔姬宣五年九月齊髙固來逆叔姬冬齊髙固及子叔姬來十六年郯伯姬來歸成五年把叔姬來歸八年夏宋公使公孫夀來納幣十月衛人來媵九年二月伯姬歸于宋夏季孫行父如宋致女晉人來媵十年五月齊人來媵内女來朝僖五年春把伯姬來朝其子傳曰女子許嫁笄而字禮之稱字則字尊于稱女也公女許嫁則視公子嫁于諸侯則視諸侯諸侯來逆則曰女而不稱字者未敢以其尊當君也既至其國則夫人矣夫人來歸則稱字而不曰夫人者父母之國詞也天子之后則命之斯成其尊矣不成其尊不足以匹至尊也諸侯之娶於諸侯敵也敵則嫌於相當天子之娶於諸侯降也降則嫌於非匹故天子之逆則稱后諸侯之逆則稱女若乃大夫自逆于公則女稱字焉以其下嫁故得申其尊也昏禮有五而獨書納幣者舉其重者也葢禮于納采曰有惠於問名曰有命於納吉曰有貺於問期曰有賜而於納徴獨曰重禮則五禮之中此為重也榖梁曰納幣使大夫正也逆女親者也攷於禮凡使者反必反命曰既得將事則納幣當使人孔子曰冕而親迎則逆女當親之然天子諸侯有邦國之事或不得親則使卿為正士昏禮曰若不親迎則婦入三月而婿見於主人然則士有故且或不親而况人君乎詩刺不親迎言其常也經書卿逆言其故也婦人謂嫁曰歸女以男為家者也魯夫人歸寧曰如某出曰歸于某魯女歸寧曰來出曰來歸魯夫人之出與魯女之嫁者同辭皆自内往而彼為主之稱也魯女之出與外之以物至者同辭皆自外來而我為主之稱也其曰如某則與公如同義生桓六年九月丁卯子同生歸脤定十四年天王使石尚來歸脤享莊四年春王二月夫人姜氏享齊侯于祝丘肆𤯝附莊二十二年春王正月肆大𤯝春秋五禮例宗卷十欽定四庫全書春秋五禮例宗卷十宋張大亨撰嘉禮昏王娶桓八年十月祭伯來遂逆王后于紀九年春紀季姜歸于京師襄十五年二月劉夏逆王后于齊娶王女莊元年夏單伯送王姬秋築王姬之舘于外冬王姬歸于齊十一年冬王姬歸于齊内娶桓三年七月公子翬如齊逆女九月齊侯送姜氏于讙公㑹齊侯于讙夫人姜氏至自齊莊二十二年冬公如齊納幣二十四年公如齊逆女秋公至自齊八月丁丑夫人姜氏入戊寅大夫宗婦覿用幣文二年冬公子遂如齊納幣四年夏逆婦姜于齊十八年冬十月夫人姜氏歸于齊宣元年正月公子遂如齊逆女二月遂以夫人婦姜至自齊成十四年秋叔孫僑如如齊逆女九月僑如以夫人婦姜氏至自齊娶内女隠二年九月紀裂繻來逆女冬十月伯姬歸于紀莊十二年紀叔姬歸于酅十九年公子結媵陳人之婦于鄄二十五年夏伯姬歸于把二十七年冬把伯姬來僖二十八年秋杞伯姬來二十七年莒慶來逆叔姬僖十四年夏季姬與鄫子遇于防鄫子來朝十五年季姬歸于鄫二十五年宋蕩伯姬來逆婦三十一年把伯姬來求婦文十四年齊人執子叔姬十五年齊人來歸子叔姬宣五年九月齊髙固來逆叔姬冬齊髙固及子叔姬來十六年郯伯姬來歸成五年把叔姬來歸八年夏宋公使公孫夀來納幣十月衛人來媵九年二月伯姬歸于宋夏季孫行父如宋致女晉人來媵十年五月齊人來媵内女來朝僖五年春把伯姬來朝其子傳曰女子許嫁笄而字禮之稱字則字尊于稱女也公女許嫁則視公子嫁于諸侯則視諸侯諸侯來逆則曰女而不稱字者未敢以其尊當君也既至其國則夫人矣夫人來歸則稱字而不曰夫人者父母之國詞也天子之后則命之斯成其尊矣不成其尊不足以匹至尊也諸侯之娶於諸侯敵也敵則嫌於相當天子之娶於諸侯降也降則嫌於非匹故天子之逆則稱后諸侯之逆則稱女若乃大夫自逆于公則女稱字焉以其下嫁故得申其尊也昏禮有五而獨書納幣者舉其重者也葢禮于納采曰有惠於問名曰有命於納吉曰有貺於問期曰有賜而於納徴獨曰重禮則五禮之中此為重也榖梁曰納幣使大夫正也逆女親者也攷於禮凡使者反必反命曰既得將事則納幣當使人孔子曰冕而親迎則逆女當親之然天子諸侯有邦國之事或不得親則使卿為正士昏禮曰若不親迎則婦入三月而婿見於主人然則士有故且或不親而况人君乎詩刺不親迎言其常也經書卿逆言其故也婦人謂嫁曰歸女以男為家者也魯夫人歸寧曰如某出曰歸于某魯女歸寧曰來出曰來歸魯夫人之出與魯女之嫁者同辭皆自内往而彼為主之稱也魯女之出與外之以物至者同辭皆自外來而我為主之稱也其曰如某則與公如同義生桓六年九月丁卯子同生歸脤定十四年天王使石尚來歸脤享莊四年春王二