body:
  text: 春秋五禮例宗卷八宋張大亨撰賔禮上朝朝王僖二十八年五月癸丑公會晉侯齊侯宋公蔡侯鄭伯衛子莒子盟于踐土公朝于王所冬天王狩于河陽壬申諸侯朝于王所來朝隱十一年春滕侯薛侯來朝桓二年春正月滕子來朝秋七月紀侯來朝左作杞六年冬紀侯來朝七年夏榖伯綏來朝鄧侯吳離來朝九年冬曹伯使其世子射姑來朝十五年夏邾人牟人葛人來朝莊五年秋郳黎來來朝二十三年公及齊侯遇于榖蕭叔朝公二十七年冬杞伯來朝僖七年夏小邾子來朝二十年夏郜子來朝二十七年春把子來朝秋滕子來朝十一年秋曹伯來朝十五年夏曹伯來朝宣元年秋邾子來朝成四年三月杞伯來朝六年夏六月邾子來朝七年夏五月曹伯來朝十八年秋杞伯來朝八月邾子來朝襄元年九月邾子來朝六年秋滕子來朝七年春郯子來朝夏四月小邾子來朝二十一年冬十月曹伯來朝二十八年夏邾子來朝昭三年秋小邾子來朝十七年春小邾子來朝秋郯子來朝定十五年正月邾子來朝哀二年夏四月滕子來朝凡諸侯見天子謂之朝亦謂之覲曲禮曰天子當依而立諸侯北面而見曰覲天子當寧而立諸公東面諸侯西面曰朝鄭氏謂朝受摯於朝受享於廟而覲則一受於廟大宗伯曰春見曰朝夏見曰宗秋見曰覲冬見曰遇由曲禮言之則朝覲之别以位由宗伯則朝覲之别以時然書稱嵗二月東巡守至於岱宗肆覲東后又曰五載一巡守羣后四朝則朝覲不必以時為别明堂位稱周公朝諸侯天子負扆而立則朝覲不必以位為别覲禮稱諸侯前朝則朝覲亦為通稱明矣論語謂子退朝則臣朝其君者也大行人謂使諸侯世相朝則諸侯交相見者也夫諸侯交相見而以臣朝其君之名名之所以崇敬讓相親睦之道也諸侯以君道臨人則可以受人之朝而不為僣敵國以敬讓相下雖朝人之國而不為屈如是則庶邦睦而王室寧矣春秋之時小國則朝大國則否故經所書朝事不一皆以小事大之禮也叔向曰明王之制間朝以講禮謂三嵗也而子太叔云五嵗一朝與行人之法固異左氏獨以子太叔為正必有據依然考於書成王命諸侯六年五服一朝又六年王乃時巡各朝於方嶽以諸侯朝王且猶六嵗則間於天子之事而相朝宜不能數於此然則世相朝殆先王之制矣凡諸侯朝王大行人逆勞於畿至於郊王人勞之至於國天子館之前朝皆受舍於朝同姓西面而異姓東面朝之日致命以玉享以幣馬既而退聽事于廟門之左天子命之歸勞其來乃出於是申以車服之賜重以享宴之好且為壇於國門之外以待會盟而令事焉諸侯自相朝之禮雖亡然司儀掌客略具其文而其實則猶見於春秋故傳稱齊侯如晉晉士鞅逆諸河魯昭公如晉自郊勞至於贈賄無失禮則亦逆勞贈好之禮也子産謂晉文公卑宫室而大諸侯之館則亦館之禮也邾隱公來朝執玉髙定公受玉卑則亦致命以玉之禮也鄭伯如晉壞垣以納車馬曰無所藏幣則亦享以幣馬之禮也隱公謂滕薛曰周之宗盟異姓為後則亦辨姓之禮也曹伯如晉受正魯襄公如晉聽政則亦聼事之禮也晉侯享諸侯鄭伯辭享則亦享宴之禮也鄭伯如楚舍而不壇則亦為壇之禮也夫為壇乃天子所以令諸侯之制春秋以小朝大則亦受其令也然則春秋諸侯相朝殆與覲禮等乎聘王聘隱七年冬天王使凡伯來聘九年春天王使南季來聘桓四年夏天王使宰渠伯糾來聘五年夏天王使仍叔之子來聘八年冬天王使家父來聘莊二十三年祭叔來聘僖三十年冬天王使宰周公來聘宣十年秋天王使王季子來聘外聘隱七年夏齊侯使其弟年來聘桓三年冬齊侯使其弟年來聘莊二十三年夏荆人來聘二十五年春陳侯使女叔來聘僖三十三年二月齊侯使國歸父來聘文四年秋衛侯使寧俞來聘九年冬楚子使椒來聘十二年秋秦伯使術來聘宣十年齊侯使國佐來聘成四年春宋公使華元來聘八年春宋公使華元來聘冬十月晉侯使士燮來聘十八年夏晉侯使士丐來聘襄元年冬衛侯使公孫剽來聘晉侯使荀罃來聘五年夏鄭伯使公子發來聘八年冬晉侯使士丐來聘十二年夏晉侯使士魴來聘二十六年夏晉侯使荀吳來聘二十七年春齊侯使慶封來聘二十九年夏五月晉侯使士鞅來聘吳子使札來聘三十年春正月楚子使薳罷來聘昭二年春晉侯使韓起來聘十二年夏宋公使華定來聘二十一年夏晉侯使士鞅來聘曲禮曰諸侯使人問於諸侯曰聘而大行人稱時聘以結諸侯之好典瑞稱圭璋以眺聘則天子使人問諸侯亦謂之聘王制稱諸侯之於天子比年一小聘三年一大聘則諸侯使人問於天子亦謂之聘榖梁曰聘諸侯非正誤矣叔向謂明王之制嵗聘以志業而子太叔稱晉文之伯也令諸侯三嵗而聘考於禮經時聘無數然則苟以事行焉可也春秋之時伯者制其數疏故合諸侯以令朝聘之數然魯襄昭之間使介不通於齊者凡二十年則其疏數不足證也周之舊制卿大夫出聘略見於司儀掌客之職而具於聘禮凡使介之來入境則卿逆而勞之至於朝則致館既入則受於廟致命則以圭入享則以幣私覿則以錦加以勞問申以享宴好以貨賄所以交鄰國之道也春秋之時略有其實故傳稱季武子聘于宋禇師假逆之以受享叔弓聘于晉晉侯使郊勞辭使致館又辭秦西乞術來聘襄仲辭玉國莊子來聘自郊勞至於贈賄禮成而加之以敏晉士鞅來聘季孫使饋七牢而享宴之禮則無國無之雖未盡合於古乃有先王之遺制焉來獨稱來如以來一見外如至門昏及以來一來遂逆后一見門隱元年十二月祭伯來閔元年冬齊仲孫來僖二十九年春介葛盧來冬介葛盧來襄十八年春白狄來凡書來有來朝有來聘然不以朝聘名之謂其禮不成也來錫莊元年冬十月王使榮叔來錫桓公命文元年夏四月天王使毛伯來錫公命成八年秋七月天子使召伯來錫公命來求歸來歸田邑二見取門昏來歸喪具見喪葬門來求歸一見門來歸脤一見本門桓十五年春二月天王使家父來求車莊六年冬齊人來歸衛俘文九年春毛伯來求金會夫人及公會一見諸侯門莊二年冬十一月夫人薑氏會齊侯于禚七年春夫人薑氏會齊侯于防冬夫人薑氏會齊侯于榖僖十七年秋夫人薑氏會齊侯于卞內女莊二十七年春公會把伯姬于洮諸侯隱二年春公會戎于潛九年公會齊侯于防十年二月公會齊侯鄭伯于中丘十一年夏公會鄭伯于時來桓元年三月公會鄭伯于垂二年七月蔡侯鄭伯會于鄧三年正月公會齊侯于嬴夏六月公會把侯于郕六年四月公會紀侯于成十年秋公會衛侯于桃丘弗遇十一年秋公會宋公于夫鍾冬十二月公會宋公于闞十二年八月公會宋公于虛冬十一月公會宋公于龜十四年正月公會鄭伯于曹十五年夏公會齊侯于艾十六年春正月公會宋公衛侯蔡侯于曹十八年正月公會齊侯于濼莊十三年春齊侯宋人陳人蔡人邾人會于北杏十四年冬單伯會齊侯宋公衛侯鄭伯于鄄十五年春齊侯宋公陳侯衛侯鄭伯會於鄄二十七年冬公會齊侯于城濮僖元年八月公會齊侯宋公鄭伯曹伯邾人于柳三年秋齊侯宋公江人黃人會于陽榖十一年夏公及夫人薑氏會齊侯于陽榖十三年公會齊侯宋公陳侯衛侯鄭伯許男曹伯于鹹十六年冬十二月公會齊侯宋公陳侯衛侯鄭伯許男邢侯曹伯于淮二十一年秋宋公楚子陳侯蔡侯鄭伯許男曹伯會于盂二十八年冬十二月會齊侯宋公陳侯衛侯鄭伯邾子秦人于溫文十三年冬公如晉衛侯會公于沓冬十二月己丑公及晉侯盟還自晉鄭伯會公于棐十七年六月諸侯會于扈宣元年夏公會齊侯于平州七年冬公會晉侯宋公衛侯鄭伯曹伯于黑壤九年秋九月晉侯宋公衛侯鄭伯會于扈十一年秋晉侯會狄于攢函成十二年夏公會晉侯衛侯于瑣澤十六年秋公會晉侯齊侯衛侯宋華元邾人于沙隨不見公襄五年秋公會晉侯宋公陳侯衛侯鄭伯曹伯莒子邾子滕子薛伯齊世子光吳人鄫人于戚七年十二月公會晉侯宋公陳侯衛侯曹伯莒子邾子于鄬鄭伯髠頑如會未見諸侯丙戌卒于鄵陳侯逃歸十年春公會晉侯宋公衛侯曹伯莒子邾子滕子薛伯把伯小邾子齊世子光會吳于柤二十一年冬公會晉侯齊侯宋公衛侯鄭伯曹伯莒子邾子于商任二十二年冬公會晉侯齊侯宋公衛侯曹伯莒子邾子滕子薛伯杞伯小邾子于沙隨二十四年秋八月公會晉侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯杞伯小邾子于夷儀昭四年夏楚子蔡侯陳侯鄭伯許男徐子滕子頓子胡子沈子小邾子宋世子佐淮夷會于申楚人執徐子定八年夏公會晉師于瓦十年夏公會齊侯于夾谷冬齊侯衛侯鄭遊速會于安甫十四年夏五月公會齊侯衛侯于牽秋齊侯宋公會于洮大搜于比蒲邾子來會公哀七年夏公會吳于鄫十一年夏公會吳于槖臯秋公會衛侯宋臯瑗于鄖十三年夏公會晉侯及吳子于黃池大夫會救災一見災門文元年秋公孫敖會晉侯于戚十一年夏叔彭生會晉郤缺于承匡宣十一年冬公孫歸父會齊侯于榖十五年春公孫歸父會楚子于宋秋仲孫蔑會齊髙固于無婁成五年夏叔孫僑如會晉荀首于榖十五年十月叔孫僑如會晉士燮齊髙無咎宋華元衛孫林父鄭公子鰌邾人會吳于鍾離襄二年秋七月仲孫蔑會晉荀罃宋華元衛孫林父曹人邾人于戚冬仲孫蔑會晉荀罃齊崔杼宋華元衛孫林父曹人邾人滕人薛人小邾人于戚五年夏仲孫蔑衛孫林父會吳于善八年春公如晉夏季孫宿會晉侯鄭伯齊人宋人衛人邾人于邢丘十四年正月季孫宿叔老會晉士丐齊人宋人衛人鄭公孫蠆曹人莒人邾人滕人薛人把人小邾人會吳于向冬季孫宿會晉士丐宋華閲衛孫林父鄭公孫蠆莒人邾人于戚十九年冬叔孫豹會晉士丐于柯二十六年公會晉人鄭良霄宋人曹人于澶淵昭元年春叔孫豹會晉趙武楚公子圍齊國弱宋向戌衛齊惡陳公子招蔡公孫歸生鄭罕虎許人曹人于虢九年春叔弓會楚子于陳十一年秋季孫意如會晉韓起齊國弱宋華亥衛北宫他鄭罕虎曹人把人于厥憗十五年夏叔詣會晉趙鞅宋樂大心衛北宫喜鄭遊吉曹人邾人滕人薛人小邾人于黃父二十一年秋晉士鞅宋樂祁犁衛北宫喜曹人邾人滕人會于扈三十一年春季孫意如會晉荀躒于適歷哀六年夏叔還會吳于柤傳稱楚子合諸侯于申問禮于宋左師鄭子産左師獻公合諸侯之禮六子産獻伯子男會公之禮六子服景伯曰王合諸侯則伯帥侯牧以見于王伯合諸侯則侯帥子男以見於伯然則王伯合諸侯之禮不同今皆無之惟宗伯稱時會而司儀掌客略具其儀耳節則未之詳也叔向以為明王之制再朝而會以示威將會而盟以顯昭明然則六嵗一會矣以宗伯言之時會無數則非有疏數苟以事行焉可也春秋之時朝聘會盟皆出強國之令久而未至則徴之亦未必有其節也周官國君命數以次而殺其别有五其節惟三公為上侯伯為次子男為下若春秋之時則伯子男合而為一故子産謂鄭伯男也而共公侯之貢孟子論周室班爵祿則又曰公一位侯一位伯一位子男同一位與周官春秋雖不合然五等之髙下固自若也先王以是稱諸侯之功而定其班列及其衰也強者并而五伯興中國不競則又擅於夷狄文武所褒大封皆威而服焉春秋所書班列之次率不與先王合或主兵或主會或主謀則雖小國有在大國之上者矣或為伯所升或為伯所黜則雖大侯有在子男之下者矣叔孫曰宋衛吾匹也又曰諸侯之會寡君未嘗後衛君則魯之班先衛而下宋矣傳曰周之宗盟異姓為後而子魚所稱踐土之盟齊宋皆下諸姬則魯之班又當在宋上矣然春秋以魯為主故凡公會諸侯不復以班皆為之冠若外諸侯則同姓亦宜為異姓之先而經不然者蓋當時先後實以強弱為之次聖人不皆正焉所以示其非也如踐土之盟子魚所稱亦與經不合豈當時載者與諸國所紀異其文哉豈聖人惡其文之正而實之違哉禮諸侯世子誓於天子攝其君則下其君之禮一等未誓則以皮帛繼子男而春秋所書諸侯世子或在國君上下一出於伯者所令而已矣諸公之孤其命數亦視子男侯伯之卿下孤一等子男之卿下侯伯一等臧宣叔曰次國之君當大國之中中當其下下當其上大夫小國之上卿當大國之下卿中當其上大夫下當其下大夫古之制也叔孫婼又謂周制列國之卿當小國之君而左氏亦云卿不會公侯會伯子男可也按列國之卿與天子之元士皆三命元士受地則得視子男而列卿則無視子男之禮其曰當小國之君未之詳也周官有卿而無上大夫則上大夫謂卿也今宣叔之言則諸侯之國既有卿又有上大夫列國之大夫固足以當小國之卿而其所謂上下次大之節禮無其文春秋所書卿大夫之次徒以國之強弱班焉未必皆古制也惟魯大夫出會則雖公侯亦在其下此與魯君先諸侯同義若外大夫與國君相當則或上或下各因所書之實以示義則其班亦不可得而考也盟諸侯盟而會一見會門隱元年三月公及邾儀父盟于蔑二年八月庚辰公及戎盟于唐十年紀子帛莒子盟于密二年冬十二月齊侯鄭伯盟于石門六年夏五月辛酉公會齊侯盟于艾八年秋七月庚午宋公齊侯衛侯盟于瓦屋桓元年夏四月公及鄭伯盟于越二年公及戎盟于唐十二年夏六月壬寅公會杞侯莒子盟于曲池秋七月丁亥公會宋公燕人盟于榖丘冬十一月丙戌公會鄭伯盟于武父十七年春正月丙辰公會齊侯紀侯盟于黃二月丙午公及邾儀父盟于趡莊十三年冬會齊侯盟于柯十六年冬十有二月會齊侯宋公陳侯衛侯鄭伯許男滑伯滕子同盟于幽二十三年十有二月甲寅公會齊侯盟于扈二十七年夏六月公會齊侯宋公陳侯鄭伯同盟于幽閔元年秋八月公及齊侯盟于落姑僖二年秋九月齊侯宋公江人黃人盟于貫五年夏公及齊侯宋公陳侯衛侯鄭伯許男曹伯會王世子于首丘秋八月諸侯盟于首止鄭伯逃歸不盟七年秋七月公會齊侯宋公陳世子欵鄭世子華盟于寧母八年春王正月公會王人齊侯宋公衛侯許男曹伯陳世子欵盟于洮鄭伯乞盟九年夏公會宰周公齊侯宋子衛侯鄭伯許男曹伯于葵丘九月戊辰諸侯盟于葵丘十五年三月公會齊侯宋公陳侯衛侯鄭伯許男曹伯盟于北丘遂至于匡公孫敖帥師及諸侯之大夫救徐十九年夏六月宋公曹人邾人盟于曹南鄫子會盟于邾己酉邾人執鄫子用之二十一年秋宋公楚子陳侯蔡侯鄭伯許男曹伯會于盂執宋公以伐宋十二月癸丑公會諸侯盟于薄釋宋公二十五年十二月癸亥公會衛子莒慶盟于洮二十六年正月己未公會莒子衛寧速盟于向二十七年冬楚人陳侯蔡侯鄭伯許男圍宋十二月甲戌公會諸侯盟于宋二十八年五月癸丑公會晉侯齊侯宋公蔡侯鄭伯衛子莒子盟于踐土陳侯如會文三年冬公如晉十二月己巳公及晉侯盟十三年冬公如晉十有二月己丑公及晉侯盟十四年六月公會宋公陳侯衛侯鄭伯許男曹伯晉趙盾癸酉同盟于新城十五年冬十有一月諸侯盟于扈十七年四月齊侯伐我西鄙六月癸未公及齊侯盟于榖宣十一年夏楚子陳侯鄭伯盟于辰陵十七年六月己未公會晉侯衛侯曹伯邾子同盟于斷道成五年十二月己丑公會晉侯齊侯宋公衛侯鄭伯曹伯邾子把伯同盟于蠱牢七年秋公會晉侯齊侯宋公衛侯曹伯莒子邾子把伯救鄭八月戊辰同盟于馬陵九年正月公會晉侯齊侯宋公衛侯鄭伯曹伯莒子把伯同盟于蒲十五年三月癸丑公會晉侯衛侯鄭伯曹伯宋世子成齊國佐邾人同盟于戚十七年夏公會丑子單子晉侯齊侯宋公衛侯曹伯邾人伐鄭六月乙酉同盟于柯陵襄三年公如晉夏四月壬戌公及晉侯盟于長樗六月公會單子晉侯宋公衛侯鄭伯莒子邾子齊世子光乙未同盟于雞澤陳侯使袁僑如會戊寅叔孫豹及諸侯之大夫及陳玄僑盟九年冬公會晉侯宋公衛侯曹伯莒子邾子滕子薛伯小邾子齊世子光伐鄭十二月己亥同盟于戲十一年夏四月公會晉侯宋公衛侯曹伯齊世子光莒子邾子滕子薛伯把伯小邾子伐鄭秋七月己未同盟于亳城北十八年冬十月公會晉侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把子小邾子同圍齊十九年春王正月諸侯盟于祝柯二十年夏六月庚申公會晉侯齊侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子盟于澶淵二十五年五月公會晉侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子于夷儀秋八月己巳同盟于重丘昭十三年秋公會劉子晉侯齊侯宋公衛侯鄭伯曹伯莒子邾子滕子薛伯把伯小邾子于平丘八月甲戌同盟于平丘公不與盟二十六年秋公會齊侯莒子邾子把伯盟于鄟陵定四年三月公會劉子晉侯宋公蔡侯衛侯陳子鄭伯許男曹伯莒子邾子頓子胡子滕子薛伯把伯小邾子齊國夏于召陵侵楚五月公及諸侯盟于臯鼬七年秋齊侯鄭伯盟于鹹齊侯衛侯盟于沙八年冬衛侯鄭伯盟于曲濮十二年冬十月癸亥公會齊侯盟于黃大夫隱元年九月及宋人盟于宿八年九月辛卯公及莒人盟于浮來桓十一年春正月齊人衛人鄭人盟于惡曹九月柔會宋公陳侯蔡侯盟于析莊九年春公及齊大夫盟于蔇十九年秋公子結媵陳人之婦于鄄遂及齊侯宋公盟二十二年秋七月丙申及齊髙傒盟于防僖十九年冬會陳人蔡人楚人鄭人盟于齊二十年秋齊人狄人盟于邢二十一年春宋人齊人楚人盟于鹿上二十九年夏會王人晉人宋人齊人陳人蔡人秦人盟于翟泉三十二年夏衛人侵狄秋衛人及狄盟文二年三月乙巳及晉處父盟夏六月公孫敖會宋公陳侯鄭伯晉士榖盟于垂隴七年秋八月公會諸侯晉大夫盟于扈八年冬十月壬午公子遂會晉趙盾盟于衡雍乙酉公子遂會雒戎盟于暴十年及蘇子盟于女栗十六年春季孫行父會齊侯于陽榖齊侯弗及盟六月戊辰公子遂及齊侯盟于郪丘宣十二年晉人宋人衛人曹人同盟于清丘成元年夏臧孫許及晉侯盟于赤棘二年六月癸酉季孫行父臧孫許叔孫僑如公孫嬰齊帥師會晉郤克衛孫良夫曹公子首及齊侯戰于鞍齊師敗績秋七月齊侯使國佐如師己酉及國佐盟于袁婁十一月公會楚公子嬰齊子蜀丙申公及楚人秦人陳人宋人衛人鄭人齊人曹人邾人薛人鄫人盟于蜀三年十一月晉侯使荀庚來聘衛侯使孫良夫來聘丙午及荀庚盟丁未及孫良夫盟十一年三月晉侯使郤犨來聘己丑及郤犨盟十六年十二月乙丑季孫行父及晉郤犨盟于扈十八年十二月仲孫蔑會晉侯宋公衛侯邾子齊崔杼同盟于虛朾襄三年六月戊寅叔孫豹及諸侯之大夫及陳袁僑盟七年冬十月衛侯使孫林父來聘壬戌及孫林父盟十五年春宋公使向戌來聘二月己亥及向戌盟于劉十六年三月公會晉侯宋公衛侯鄭伯曹伯莒子邾子薛伯把伯小邾子于溴梁戊寅大夫盟二十年正月辛亥仲孫速會莒人盟于向二十七年夏叔孫豹會晉趙武楚屈建蔡公孫歸生衛石惡陳孔奐鄭良霄許人曹人于宋秋七月辛巳豹及諸侯之大夫盟于宋昭十一年五月仲孫貜會邾子盟于祲􅖤定三年冬仲孫何忌及邾子盟于拔哀二年春王二月季孫斯叔孫州仇仲孫何忌帥師伐邾取漷東田及沂西田癸巳叔孫州仇仲孫何忌及邾子盟于句繹來盟桓十四年春正月公會鄭伯于曹夏五闕文鄭伯使其弟語來盟閔二年冬齊髙子來盟僖四年正月公會齊侯宋公陳侯衛侯鄭伯許男曹伯侵蔡蔡潰遂伐楚次于陘夏楚屈完來盟于師盟于召陵文十五年三月宋司馬華孫來盟宣七年春衛侯使孫良夫來盟襄二十九年五月把子來盟涖盟僖三年秋齊侯宋公江人黃人會于陽榖冬公子友如齊涖盟文七年冬徐伐莒公孫敖如莒涖盟昭七年正月暨齊平三月叔孫婼如齊涖盟定十一年冬及鄭平叔還如鄭涖盟古者天子巡守諸侯入朝王皆為壇於國門之外加方明焉天子祀之蓋以為盟尸也先王躬誠明之德以臨下人孰不信而必有事乎齊盟者蓋在我者可以質諸鬼神而不疑然後可以責人之信已且在我可任而在人者不可保故也殺牲而歃其血以示信之由衷珠槃玉敦以奉之以示意之精純載書以示言之可復雖然不先以德則神弗聽而誠弗固凡春秋之盟是也然以齊桓之德葵丘之會猶能使諸侯束牲載書而不歃血則先王躬誠明以涖之可知矣經有同盟者杜氏謂異服也有涖盟者榖梁謂外前定之詞也有來盟者榖梁謂內前定之詞也胥命桓三年夏齊侯衛侯胥命于蒲春秋五禮例宗卷八欽定四庫全書
