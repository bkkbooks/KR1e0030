body:
  text: 春秋五禮例宗春秋類提要臣等謹按春秋五禮例宗七卷宋張大亨撰大亨字嘉父湖州人登元豐乙丑乙科何薳春渚紀聞王明清玉照新志並載其嘗官司勳職以王國侍讀講官名與朝廷相紊奏請改正事陳振孫書録解題載大亨春秋通訓及此書則稱為直祕閣吳興張大亨撰蓋舉其所終之官也考左傳發凡杜預謂皆周公典禮韓起見易象春秋亦謂周禮在魯孫復作春秋尊王發微葉得得譏其不深于禮樂故其言多自抵牾蓋禮與春秋本相表裏大亨是編以社預釋例與經踳駁兼不能賅盡陸淳所集啖趙春秋纂例亦支離失真因取春秋事迹分吉凶軍賔嘉五禮依類别記各為總論義例賅貫而無諸家拘例之失陳振孫稱為考究詳洽殆非溢美元吳澄作春秋纂言列五禮多與此書相出入澄非剽襲人書者殆偶未見傳本歟朱彛尊經義考載此書十卷注曰存而諸家寫本皆佚其軍禮三卷已非彛尊之所見然永樂大典作於明初凡引此書皆吉凶嘉賓四禮之文軍禮絶無一字則此三卷之佚久矣彛尊偶未核檢也乾隆四十五年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀春秋五禮例宗原序昔杜元凱作釋例以明春秋異同之義事類相發各為條綱使覽者用力少而見功多可謂善矣然其間雜以傳例與經蹐駁而又摘數端不能該盡學者病之唐陸淳乃因啖趙之餘别為纂例其所條列一出於經比於杜公詳顯完密後之説者謂之要例然淳拘於微文捨事從例故事有相濟以成而反裂為數門者非特差失其始終抑亦汨昏其義趣經大旨支離失真迷眩後生莫此為盛蓋人之美惡小大萬殊聖人因其實而被之以名豈專拘於繩約若乃定其筆削以示後世則固有典要存焉善學者因其人之美惡以推聖人之心而究觀其典要之所在則其旨不辨而自白矣顧豫非知經者特懼子弟之溺於斯乃綴緝本文通其乖舛以刋前作之誤名曰春秋五禮例宗蓋周禮盡在魯矣聖人以為法凡欲求經之軌範非五禮何以質其從違觀者或無間於古今則當信豫言之不妄也紹聖四年二月十七日張大亨序
