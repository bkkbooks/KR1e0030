body:
  text: 春秋五禮例宗卷七宋張大亨撰軍禮四蒐狩天王僖二十八年冬天王狩于河陽内桓四年正月公狩于郎七年春二月己亥焚咸丘莊四年冬公及齊人狩于禚昭八年秋蒐于紅十一年五月大蒐于比蒲二十二年春大蒐于昌間定十三年夏大蒐于比蒲十四年秋大蒐于比蒲哀十四年春西狩獲麟春曰蒐夏曰苖秋曰獮冬曰狩經書蒐狩而不及苖獮則以苖獮皆如蒐田之法故耳且四時之田莫先於蒐莫備於狩於是焉有失則書之其餘雖失未足道也猶之四時之祭獨舉烝嘗則以春夏物不備雖有失焉未害於禮之成也凡禮以其常舉之則无小大之異其曰大者皆越其常者也城堕附内隠七年夏城中丘九年夏城郎桓五年夏城祝丘十六年冬城向莊二十九年城諸及防文七年春公伐邾城須句遂城郚十二年冬季孫行父帥師城諸及鄆宣八年冬十月城平陽成四年冬城鄆九年十一月城中城襄七年夏四月城費十二年冬城防十五年夏季孫宿叔孫豹帥師城成郛十九年冬城西郛城武城定六年冬城中城十二年夏叔孫州仇帥師堕費季孫斯仲孫何忌帥師堕費十四年秋城莒父及霄十五年冬城漆哀三年五月季孫斯叔孫州仇帥師城啓陽四年夏城西郛五年春城毗六年春城邾瑕外莊三十二年春城小榖僖元年夏六月邢遷于夷儀齊師宋師曹師城邢二年春正月城楚丘十四年春諸侯城縁陵㐮二年冬仲孫蔑㑹晉荀罃齊崔杼宋華元衛孫林父曹人邾人滕人薛人小邾人于戚遂城虎牢二十九年夏仲孫羯㑹晉荀盈齊髙止宋華元衛世叔儀鄭公孫叚曹人莒人邾人滕人薛人小邾人城把昭三十二年冬仲孫何忌㑹晉韓不信齊髙張宋仲几衛世叔申鄭國參曹人莒人薛人把人小邾人城成周興築毁附莊九年冬浚洙二十八年冬築郿二十九年春新延廐三十一年春築䑓于郎夏四月築䑓于薛秋築䑓于秦僖二十年春新作南門文十六年八月毁泉䑓成十八年秋築鹿囿昭九年冬築郎囿定二年冬新作雉門及两觀十三年夏築蛇淵囿左氏曰凡邑有宗廟先君之主曰都無曰邑邑曰築都曰城穀梁曰城為保民為之也民衆城小則益城益城無極凡城之志皆譏也夫城有二有増舊而城之者有作都邑而城之者今曰益城無極則是特論増城者耳詩稱王命南仲往城于方易稱王公設險以守其國而大司馬之屬以時脩城郭之固則城者先王所不廢特以為不恃此以保民則可矣故傳稱言不戒城惡而致潰也城因築而後成故亦謂之築而築不作以盡城之義葢曰城則有厲禁封守之法焉若以為都邑之辨則作邑于豐既成洛邑非無宗廟者也凡土功龍見而戒事火見而致用水昏正而栽日至而畢過亦書春秋五禮例宗卷七欽定四庫全書
