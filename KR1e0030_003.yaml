body:
  text: 春秋五禮例宗卷三宋張大亨撰凶禮下弒殺葬外弒君滅執以殺以用三見執門隱四年二月戊申衛州吁弒其君完九月衛人殺州吁于濮五年夏四月葬衛桓公桓二年正月戊申宋督弒其君與夷及其大夫孔父六年蔡人殺陳他左傳五年陳侯鮑卒文公子他殺太子免而代之莊八年十一月癸未齊無知弒其君諸兒九年春齊人殺無知七月丁酉葬齊襄公十二年八月甲午宋萬弒其君捷及其大夫仇牧僖十年正月晉里克弒其君卓及其大夫荀息夏晉殺其大夫里克文元年十月丁未楚世子商臣弒其君頵十四年九月齊公子商人弒其君舍十六年十一月宋人弒其君杵臼十八年五月戊戌齊人弒其君商人冬莒弒其君庶其宣二年九月乙丑趙盾弒其君夷臯四年六月乙酉鄭公子歸生弒其君夷十年五月癸巳陳夏徴舒弒其君平國十一年十月楚人殺陳夏徴舒十二年春葬陳靈公十八年七月邾人戕鄫子于鄫成十八年正月庚申晉弒其君州蒲襄二十五年五月乙亥齊崔杼弒其君光二十六年二月辛卯衛寧喜弒其君剽二十六年夏衛殺其大夫寧喜二十九年五月閽弒吳子餘祭三十年四月蔡世子般弒其君固十月葬蔡景公三十一年十一月莒人弒其君密州昭十一年夏四月丁巳楚子虔誘蔡侯般殺之于申十三年冬十月葬蔡靈公十三年四月楚公子比自晉歸于楚弒其君虔于乾溪楚公子棄疾殺公子比十六年春楚子誘戎蠻子殺之十九年夏五月戊辰許世子止弒其君買穀梁曰止未逾年而死冬葬許悼公二十七年夏四月吳弒其君僚定十三年冬薛弒其君比哀四年二月庚戌盜弒蔡侯申十二月葬蔡昭公左氏夏蔡人殺賊六年秋齊陳乞弒其君荼外未成君僖九年冬晉里克弒其君之子奚齊左氏曰凡弒君稱君君無道也稱臣臣之罪也公羊曰大夫弒君稱名氏微者窮諸人賤者窮諸盜其稱國者衆辭也榖梁曰稱國以弒其君君惡甚矣夫弒君天地之大惡人倫之所棄也君雖無道臣必蒙首惡之誅所以定名分遏禍亂也今以君無道而略弒賊之名則是君可得而僇矣豈聖人意哉凡弒者難生於一人則斥其名合衆力以行之則稱人假國勢以行之則稱國人臣假國之靈以取重而反以其重危其君此之謂大惡然則惡大矣而沒其名豈不利於為惡者哉夫國人君之而已獨致難焉則惡其名之彰徹聖人於是名之名之則其罪顯力足以使衆權足以用國以此危其君則將以有為也聖人于是沒其名沒其名則其罪深夫春秋非特録善惡之實而已也其文則存乎史其義則見乎經故由其文則名雖沒而不憂後世之無所考由其義則凡不即史者聖人之意也凡諸侯不以道終于下曰弒于兵曰滅戕之曰戕尸之曰用于敵國曰殺重君變也大夫公子不以其道死皆曰殺略臣事也公羊曰君弒而賊不討則不書葬謂其國無臣子也然則賊已討而不書葬者魯不會也何以知其然魯之隱閔非不葬也而不書則以賊不討故也宋公捷衛侯剽之賊討矣而不書葬則以魯不會故也夫弒而不討固臣子之罪然有可討者有不可討者弒而篡之位未及定未命於天子未會於諸侯國人殺之聖人與焉書曰某人殺某是也既命於天子既會于諸侯而位既定矣國人殺之聖人不與書曰某人弒其君是也此可討不可討之義也夫奪君之國而有之其罪顯且大故不俟貶絶而惡見然天子已命之諸侯已列之則成其為君成其為君而國人又加僇焉則是君無時而定位國無時而難息也故復被以弒君之名夫使篡人得正其名為君者是天子諸侯之過也若國人已君之則又安得加僇僇雖不可加而其罪則不為之泯不泯其罪以存善惡之戒不戮其成君以息爭奪之難聖人之微意也陳恆弒君孔子請討之則凡弒者內外皆得以討今不討而又會之故曰諸侯之過也若乃魯桓公見殺于齊蔡靈公見殺于楚則以敵國非所以言弒故不以討罪而葬也王殺大夫宣十五年王札子殺召伯毛伯襄三十年五月天王殺其弟佞夫內殺大夫僖二十八年春公子買戍衛不卒戍刺之成十六年二月乙酉刺公子偃外殺大夫殺弒賊七見殺門殺因弒被殺三見殺門執以二見執門莊九年九月齊人取子紏殺之二十二年正月陳人殺其公子御寇二十六年夏曹殺其大夫僖五年春晉人殺其世子申生七年夏鄭殺其大夫申侯十一年春晉殺其大夫丕鄭父二十五年夏宋殺其大夫二十八年四月楚殺其大夫得臣三十年秋衛殺其大夫元咺及公子瑕文六年十月晉殺其大夫陽處父七年四月宋人殺其大夫八年十月宋人殺其大夫司馬九年二月晉人殺其大夫先都三月晉人殺其大夫士縠及箕鄭父十年夏楚殺其大夫宜申宣九年冬陳殺其大夫泄冶十三年冬晉殺其大夫先縠十四年衛殺其大夫孔逹成八年夏晉殺其大夫趙同趙括十五年秋宋殺其大夫山十六年六月楚殺其大夫側十七年十二月晉殺其大夫郤錡郤犨郤至十八年春正月晉殺其大夫胥童齊殺其大夫國佐襄二年冬楚殺其大夫公子申五年秋楚殺其大夫公子壬夫十年冬盜殺鄭公子騑公子發公孫輒十九年秋齊殺其大夫髙厚鄭殺其大夫公子嘉二十年秋蔡殺其大夫公子燮二十二年冬楚殺其大夫公子追舒二十三年夏陳殺其大夫慶虎及慶寅冬晉人殺欒盈二十六年秋宋公殺其世子痤三十年秋鄭人殺良霄昭二年秋鄭殺其大夫公孫黑五年春楚殺其大夫屈申八年春陳侯之弟招殺陳世子偃師秋陳人殺其大夫公子過冬十月楚師滅陳執陳公子招放之于越殺陳孔奐十二年五月楚殺其大夫成熊十四年冬莒殺其公子意恢二十年秋盜殺衛侯之兄縶二十七年四月楚殺其大夫郤宛哀二年十一月蔡殺其大夫公子駟四年夏蔡殺其大夫公孫姓公孫霍十三年十一月盜殺陳夏區夫公羊曰稱國以殺者君殺大夫之辭也榖梁曰稱國以殺殺無罪也又曰罪纍上也稱人以殺殺有罪也左氏曰殺大夫不稱名衆也且言非其罪也夫大夫之罪不登於死而君殺之徒以有國之威耳故謂之君殺大夫葵丘之盟無專殺大夫意謂此也其曰罪纍上者以繫之君也大夫有罪國人皆曰可殺於是殺之則稱人此與衆棄之之義也大夫生死皆名雖曰無罪而死亦必名之所以正君臣之分其是非不在此也殺而不名雖曰衆也然晉鄭一日殺三卿而經并書其名則曹宋之卿亦未必衆也特以彼不告故不得而詳耳然卿與大夫異位而皆曰大夫以周官大夫有中下而無上則卿者上大夫故也或曰大夫或曰公子或曰世子或曰兄弟榖梁謂公子未命為大夫者然其重視大夫君之世嫡曰世子母昆弟曰兄弟其見殺也不以有罪無罪皆斥其君以明親親之道也彼無罪而君殺之君失其親彼有罪而致殺彼失其親然周制同姓之罪不即市而致刑於甸師焉不與國人慮之也為人君而自賊其類不祥莫大焉災變日食隱三年春王二月己巳日有食之桓三年秋七月壬辰朔日有食之既十七年冬十月朔日有食之莊十八年春王三月日有食之二十五年六月辛未朔日有食之鼓用牲于社二十六年十二月癸亥朔日有食之三十年九月庚午朔日有食之鼓用牲于社僖五年九月戊申朔日有食之十二年春王三月庚午日有食之十五年夏五月日有食之文元年二月癸亥日有食之十五年六月辛丑朔日有食之鼓用牲于社宣八年七月甲子日有食之既十年夏四月丙辰日有食之十七年六月癸卯日有食之成十六年六月丙寅朔日有食之十七年十二月丁巳朔日有食之襄十四年二月乙未朔日有食之十五年八月丁巳日有食之二十年十月丙辰朔日有食之二十一年九月庚戌朔日有食之冬十月庚辰朔日有食之二十三年春王二月癸酉朔日有食之二十四年七月甲子朔日有食之既八月癸巳朔日有食之二十七年十二月乙亥朔日有食之昭七年四月甲辰朔日有食之十五年六月丁巳朔日有食之十七年六月甲戌朔日有食之二十一年七月壬午朔日有食之二十二年十二月癸酉朔日有食之二十四年五月乙未朔日有食之三十一年十二月辛亥朔日有食之定五年春王三月辛亥朔日有食之十二年十一月丙寅朔日有食之十五年八月庚辰朔日有食之凡日月之食有當交而食者隂陽之數也有不應食者變異之所出也夫陽不勝隂則日為之食是以人君惡之先王克謹天戒設官置史以先之自堯舜以來未之改也或失其職則以為大戮故左氏謂天子有日官諸侯有日御其不書日者官失之而羲和廢時亂日則夏后征焉春秋之時官廢不舉所書日食或失其甲子或失其晦朔聖人不加損焉以示過也然春秋不以日月為例而此獨以不書為失則以日之食也必在於朔而晦朔必由甲乙然後可推今既曰朔矣則是知其甲乙也既知其甲乙矣則是知其為晦朔也然或書朔而無甲乙或書甲乙而無朔或兩不書為足以明日官日御之過而異乎餘事之繫於日月者也餘事不繫之以日月則前史所闕雖孔子不可得而知非若日食之存乎度數者可考故也夫春秋不以日月為例何也曰日月記事之常體本無可以示義之意先儒之説雖多然考其所書雜然不可為之典要故或時而不月或月而不時或有時與日而無月或有月而無時或全年無月凡五或全年無日或無事書首月以具四時亦或不必具者時月日皆備惟襄公三十年一且聖人不務彌縫其闕則以褒貶所寄不在乎此也晦朔附僖十五年九月乙卯晦十六年春王正月戊申朔二十二年冬十一月己巳朔成十六年六月甲午晦星莊七年夏四月辛卯夜恆星不見夜中星隕如雨文十四年秋七月有星孛入于北斗昭十七年冬有星孛于大辰哀十三年冬十一月有星孛于東方霜僖三十三年十二月隕霜不殺草李梅實定元年冬十月隕霜殺菽雪一見震雷門桓八年冬十月雨雪僖十年冬大雨雪昭四年春王正月大雨雪左作雹震電隱九年三月癸酉大雨震電庚辰大雨雪僖十五年九月己卯晦震夷伯之廟雹僖二十九年秋大雨雹昭三年冬大雨雹雨莊三十一年冬不雨僖二年冬十月不雨三年春王正月不雨夏四月不雨六月雨文二年自二月不雨至于秋七月十年自正月不雨至于秋七月十三年自正月不雨至于秋七月旱僖二十一年夏大旱宣七年秋大旱水桓元年秋大水十三年夏大水莊十年秋大水十一年秋宋大水二十四年八月大水二十五年秋大水鼓用牲于社于門宣十年秋大水成五年秋大水襄二十四年秋七月大水凶年莊七年秋無麥苖二十八年冬大無麥禾臧孫辰告糴于齊宣十年冬飢十五年冬飢襄二十四年冬大飢定三年夏歸粟于蔡凶年一也或以所無書或以飢書書所無者民未必飢也而上有所乏至於飢則上下匱矣冰桓十四年春正月無冰成元年二月無冰十六年春王正月雨大冰襄二十八年春無冰火宫廟三見本門莊二十年夏齊大災僖二十年五月乙巳西宫災宣十六年夏成周宣榭火襄九年春宋災三十年五月甲午宋災冬晉人齊人宋人衛人鄭人曹人莒人邾人滕人薛人把人小邾人會于澶淵宋災故昭九年夏四月陳災十八年五月壬午宋衛陳鄭災定二年夏五月壬辰雉社及兩觀災哀四年六月辛丑亳社災左氏曰凡火天火曰災人曰火火之所及者小則人可為也至於所及者廣則宜非人力所可為故謂之災謂之災則弔恤之禮行焉公羊以為國邑之辨誤矣地文九年九月癸酉地震襄十六年五月甲子地震昭十九年五月己卯地震二十三年八月乙未地震哀三年四月甲午地震山石僖十四年秋八月辛卯沙鹿崩十六年正月戊申朔隕石于宋丘成五年夏梁山崩螽桓五年秋螽僖十五年八月螽文三年秋雨螽于宋八年冬十月螽宣六年秋八月螽十三年秋螽十五年秋螽襄七年八月螽哀十二年冬十二月螽十三年九月螽十二月螽螟隱五年九月螟八年九月螟莊六年秋螟雜蟲莊十八年秋有􅈮二十九年秋有蜚宣十五年冬蝝生禽獸莊十七年冬多麋僖十六年正月戊申朔隕石于宋五是月六鷁退飛過宋都昭二十五年夏鸜鵒來巢左氏曰凡物不為災不書夫螽螟麋􅈮固害物矣而蜚鷁鸜鵒則非能為災者也公羊有記災記異之辨是矣災異春秋之書變異為傳者其説不同聖人果以人事測天乎曰天地與人其類既殊其事相逺非有語言臭味可相交際而得之也然至其變景象怪忒之物動乎其間則君子恐懼修省而弗敢忽焉是故天大雷電以風書志成王之畏日食震電川沸山崩詩刺幽王之亂而雊鼎之雉同穎之禾拱生之桑榖聖人存之以示戒而於春秋尤詳焉以謂天地之道雖幽微逺甚而其氣類發越託於衆類者必皆有以召之然聖人不主名其所以召之者以謂不可知也吾見天地之行有異也曰是必人事之有失云耳吾將推人事之失以合於天而不知其果合與否也曰是不可必存之以示戒云耳及後之為説者不然曰天地之異如此吾必求所以當之者昔為某事今有某應於是附會白黑棄捐度數而務通其意之所同至其不合也則遷就以益之誣天罔民莫大於此吾知其所本矣蓋為傳者之過也夫為傳者不深求聖人所以必書之意而扳援慎竈卜祝之言以為説凡日星有謫曰今茲某國之君盍當其變或水或旱盍係其應又或緣其事而生或因其言而息嗚呼天道果如是其膠耶蓋其間固有度數所繩不得不然者有隂陽錯盩不可以度數求者有非常而興者聖人兼而舉之以見天道之多變以明吉凶之無常非必指事以為應也洪範五徴雖主於五事然五事之所該有不可勝窮者矣夫既或係乎度數而不得不然則其以變異書何也曰由度數而然者常也其不可以度數求者異也即其常則足以見其異是故兩不相廢焉不然則當時諸侯其數千百事之善否日固萬變苟一國之君一事之失而必謫見於天則天事亦已勞矣春秋五禮例宗卷三
